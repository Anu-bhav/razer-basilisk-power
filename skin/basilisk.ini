[Rainmeter]
Update=1000
Author=Anu-bhav
AccurateText=1
DynamicWindowSize=1

[Variables]
; Same palette/font as the custom Simplic CPU and RAM widget.
; #@# = this skin's own @Resources folder (Rainmeter does not share
; @Resources between configs), which holds the copy of Variables.inc.
@include=#@#Variables.inc
JsonUrl=file:///C:/Users/User/AppData/Local/BasiliskPower/status.json

; How often the skin re-reads status.json, in seconds.
;
; 5 is a deliberate compromise: a dock or charge change shows up within about
; five seconds, and an idle mouse costs a handful of tiny local file reads per
; minute instead of sixty.
;
; NOTE: this is documentation only. UpdateDivider below deliberately uses the
; literal 5 rather than #ReadSeconds#, because Rainmeter ignores variables
; there -- with a variable the measure keeps its default and the skin never
; re-reads the file after the initial load. If you change the cadence, change
; both this comment and the UpdateDivider line.
ReadSeconds=5

; A feed older than this many seconds is treated as dead: the widget shows
; "--" and "NO SIGNAL" instead of freezing on the last battery reading.
; 90 s tolerates the tray's slowest adaptive poll (30 s) with room to spare.
StaleSeconds=90

; At or below this level, off the dock, the fill and percentage turn red.
; Charging still wins: a docked mouse uses the magenta charging look even
; when the level is low.
LowBatteryPercent=15

;-------------------------------------------------------------
; MEASURES — status.json feed written by Basilisk Power
;-------------------------------------------------------------

[measureStatus]
Measure=WebParser
Url=#JsonUrl#
; NOTE: no "U" (ungreedy) flag here — it would also make \d+ ungreedy,
; so "level":57 would capture only "5" and eta 108 only "1".
RegExp=(?si)"level":\s*(-?\d+).*"charging":\s*(\d+).*"source":\s*"([^"]*)".*"eta_full_min":\s*(-?\d+).*"updated":\s*"([^"]*)"
UpdateDivider=1
; How often WebParser actually reads the file, in milliseconds. The default is
; 600, which multiplies with Update and UpdateDivider -- so without this the
; skin only re-read status.json about every 50 minutes. 1 means "every update".
UpdateRate=1

; Battery % as shown in the big right column ("--" when no device reports).
[measureLevel]
Measure=WebParser
Url=[measureStatus]
StringIndex=1
Substitute="-1":"--"

; The charging flag, and the fill it drives.
;
; The flag is 1 while the mouse is on the dock, 0 when it is lifted. A failed
; read leaves the previous value, which the tray clears on the next poll.
;
; This measure is only the raw flag. The visual state (stale / idle /
; charging / low) is driven entirely by [cState] below.
;
; It used to carry IfMatchAction bangs too. That let a *stale* feed's old
; charging=1 value re-show the magenta meters after cState had hidden them,
; so the two paths fought. One state machine is easier to reason about and
; makes stale recovery deterministic.
[measureCharging]
Measure=WebParser
Url=[measureStatus]
StringIndex=2

; Minutes to full while charging ("" when unknown / not charging).
[measureEta]
Measure=WebParser
Url=[measureStatus]
StringIndex=4
Substitute="-1":""

; dock / wired / wireless / none → connection word.
[measureSource]
Measure=WebParser
Url=[measureStatus]
StringIndex=3
Substitute="dock":"DOCKED","wired":"WIRED","wireless":"WIRELESS","unknown":"?","none":"NO DEVICE"

; Age of the feed in seconds, computed against Rainmeter's own clock.
;
; The Lua measure reads updated_unix straight from status.json instead of
; adding a capture to [measureStatus]. Rainmeter rejected the longer regex
; at runtime even though it was valid PCRE, and keeping the proven feed
; regex untouched is safer than debugging that parser.
;
; A missing or unparsable feed returns -1, which [cState] treats as stale.
[mFeedAge]
Measure=Script
ScriptFile=#@#freshness.lua
DynamicVariables=1

[mLevelCalc]
Measure=Calc
MinValue=0
MaxValue=100
; measureLevel is a display string (Substitute turns -1 into "--"), so do the
; maths on the raw parent capture instead. Without this the Calc errored with
; "Extra operation" and the fill stayed empty.
Formula=(measureLevelNum < 0 ? 0 : (measureLevelNum > 100 ? 100 : measureLevelNum))
DynamicVariables=1

; The level as a number, for the fill. A failed or missing read is -1.
[measureLevelNum]
Measure=WebParser
Url=[measureStatus]
StringIndex=1

; Charging → magenta fill + bolt + CHARGING word; else cyan fill.
; Pulse phase: counts up by one each skin update. mPulseBolt turns that into
; a triangle wave between 55 and 255 alpha over four ticks (~4 s round trip).
[mPulse]
Measure=Calc
Formula=(mPulse + 1) % 8
DynamicVariables=1
UpdateDivider=1

[mPulseBolt]
Measure=Calc
Formula=(mPulse < 4 ? (55 + mPulse * 50) : (255 - (mPulse - 4) * 50))
DynamicVariables=1
MinValue=0
MaxValue=255

; Fill dim for the charging bar: 90 -> 24 -> 90 over eight ticks.
[mFillDim]
Measure=Calc
Formula=(mPulse < 4 ? (90 - mPulse * 22) : (24 + (mPulse - 4) * 22))
DynamicVariables=1
MinValue=24
MaxValue=90

; Body wash follows the same clock at ~1/7 of the bolt alpha.
[mBodyGlow]
Measure=Calc
Formula=(mPulse < 4 ? mPulse * 12 : (7 - mPulse) * 12)
DynamicVariables=1
MinValue=0
MaxValue=36

; Glow layers: same triangle wave, each at a fraction of the bolt's alpha so
; the halo reads as a soft falloff rather than a hard outline.
[mGlowNear]
Measure=Calc
Formula=(mPulseBolt * 0.45)
DynamicVariables=1
MinValue=0
MaxValue=255

[mGlowMid]
Measure=Calc
Formula=(mPulseBolt * 0.26)
DynamicVariables=1
MinValue=0
MaxValue=255

[mGlowWide]
Measure=Calc
Formula=(mPulseBolt * 0.13)
DynamicVariables=1
MinValue=0
MaxValue=255

;----------------------------------------------------------------
; Feed freshness state
;----------------------------------------------------------------
;
; 0 = stale (or no feed yet): show "--" / NO SIGNAL, hide the battery fill
; 1 = fresh, not charging, above the low threshold: cyan fill
; 2 = fresh, charging: magenta fill + bolt
; 3 = fresh, not charging, at or below #LowBatteryPercent#: red fill
;
; Encoding the charging state here (as well as in [measureCharging]) is what
; makes recovery deterministic: when a dead feed starts writing again, this
; measure moves from 0 to 1 or 2 and re-asserts the whole visual state.
;
; NOTE: use nested ternaries, never `&&`, inside a Calc Formula. Rainmeter's
; Formula parser mishandled `(level >= 0 && level <= 15)` -- it returned true
; at level 50 -- while the same expression is fine in an IfCondition.
[cState]
Measure=Calc
Formula=((mFeedAge >= 0) ? ((mFeedAge <= #StaleSeconds#) ? (measureCharging = 1 ? 2 : (measureLevelNum >= 0 ? (measureLevelNum <= #LowBatteryPercent# ? 3 : 1) : 1)) : 0) : 0)
DynamicVariables=1
IfCondition=(cState = 0)
IfTrueAction=[!HideMeter MeterLevel][!HideMeter MeterSource][!ShowMeter MeterLevelStale][!ShowMeter MeterSourceStale][!HideMeter MeterFillCyan][!HideMeter MeterFillMagenta][!HideMeter MeterFillLow][!HideMeter MeterLevelLow][!HideMeter MeterFillPulse][!HideMeter MeterBodyPulse][!HideMeter MeterBoltGlowWide][!HideMeter MeterBoltGlowMid][!HideMeter MeterBoltGlowNear][!HideMeter MeterBolt][!HideMeter MeterEta][!Redraw]
IfCondition2=(cState = 1)
IfTrueAction2=[!ShowMeter MeterLevel][!ShowMeter MeterSource][!HideMeter MeterLevelStale][!HideMeter MeterSourceStale][!HideMeter MeterLevelLow][!ShowMeter MeterFillCyan][!HideMeter MeterFillMagenta][!HideMeter MeterFillLow][!HideMeter MeterFillPulse][!HideMeter MeterBodyPulse][!HideMeter MeterBoltGlowWide][!HideMeter MeterBoltGlowMid][!HideMeter MeterBoltGlowNear][!HideMeter MeterBolt][!Redraw]
IfCondition3=(cState = 2)
IfTrueAction3=[!ShowMeter MeterLevel][!ShowMeter MeterSource][!HideMeter MeterLevelStale][!HideMeter MeterSourceStale][!HideMeter MeterLevelLow][!HideMeter MeterFillCyan][!ShowMeter MeterFillMagenta][!HideMeter MeterFillLow][!ShowMeter MeterFillPulse][!ShowMeter MeterBodyPulse][!ShowMeter MeterBoltGlowWide][!ShowMeter MeterBoltGlowMid][!ShowMeter MeterBoltGlowNear][!ShowMeter MeterBolt][!Redraw]
IfCondition4=(cState = 3)
IfTrueAction4=[!HideMeter MeterLevel][!ShowMeter MeterSource][!HideMeter MeterLevelStale][!HideMeter MeterSourceStale][!ShowMeter MeterLevelLow][!HideMeter MeterFillCyan][!HideMeter MeterFillMagenta][!ShowMeter MeterFillLow][!HideMeter MeterFillPulse][!HideMeter MeterBodyPulse][!HideMeter MeterBoltGlowWide][!HideMeter MeterBoltGlowMid][!HideMeter MeterBoltGlowNear][!HideMeter MeterBolt][!Redraw]

; ETA line only while the tray has a real estimate.
;
; The tray reports 0 for a full battery and -1 when it cannot estimate yet.
; Neither is useful to show -- at 100% there is nothing left to wait for --
; so the line appears only for a positive number of minutes.
[cEta]
Measure=Calc
Formula=measureEta
DynamicVariables=1

; 1 when the ETA should be on screen, else 0.
;
; Same nested-ternary rule as [cState]: no `&&` inside a Calc Formula.
; A stale feed must hide the line, and a recovered feed must bring it back
; even when the charging flag never changed while it was dead.
[cEtaVisible]
Measure=Calc
Formula=((cEta > 0) ? ((measureCharging = 1) ? ((mFeedAge >= 0) ? ((mFeedAge <= #StaleSeconds#) ? 1 : 0) : 0) : 0) : 0)
DynamicVariables=1
IfCondition=(cEtaVisible = 1)
IfTrueAction=[!ShowMeter MeterEta][!Redraw]
IfFalseAction=[!HideMeter MeterEta][!Redraw]

;-------------------------------------------------------------
; BATTERY GLYPH (transparent PNG outline over a dynamic fill)
;-------------------------------------------------------------

; Level fill inside the battery body — cyan, or magenta while charging.
[MeterFillCyan]
Meter=Bar
MeasureName=mLevelCalc
X=34
Y=24
W=68
H=40
BarColor=#NeonBlue#
BarOrientation=Horizontal

[MeterFillMagenta]
Meter=Bar
MeasureName=mLevelCalc
X=34
Y=24
W=68
H=40
BarColor=#FontColor2_Neon#
BarOrientation=Horizontal
Hidden=1

; Low-battery fill, off the dock only.
[MeterFillLow]
Meter=Bar
MeasureName=mLevelCalc
X=34
Y=24
W=68
H=40
BarColor=#LowBattery#
BarOrientation=Horizontal
Hidden=1

; Dims the filled part of the charging bar, so the bar itself breathes
; without changing its colour. Width tracks the current level.
[MeterFillPulse]
Meter=Shape
Shape=Rectangle 34,24,(68*[mLevelCalc]/100),40,3 | Fill Color 0,0,0,[mFillDim] | StrokeWidth 0
DynamicVariables=1
Hidden=1

; Charging breath: a faint magenta wash over the body, alpha 0 -> 36 -> 0
; over eight skin ticks. Drawn before the outline so the rim stays sharp.
[MeterBodyPulse]
Meter=Shape
Shape=Rectangle 34,24,68,40,3 | Fill Color 255,43,255,[mBodyGlow] | StrokeWidth 0
DynamicVariables=1
Hidden=1

; Battery outline drawn above the fill (transparent interior).
[MeterBattery]
Meter=IMAGE
ImageName=#@#battery.png
X=30
Y=20
W=92
H=48

; Charging bolt, centered on the battery body.
; Glow: the same bolt silhouette, enlarged and faint, layered to fake a
; soft halo. Centred on the bolt's own centre (68, 44) so the bolt does not
; move. Drawn before the bolt so it sits behind it.
[MeterBoltGlowWide]
Meter=IMAGE
ImageName=#@#bolt.png
X=48
Y=17
W=40
H=54
ImageTint=255,255,255
ImageAlpha=[mGlowWide]
DynamicVariables=1
Hidden=1

[MeterBoltGlowMid]
Meter=IMAGE
ImageName=#@#bolt.png
X=52
Y=22
W=32
H=44
ImageTint=255,255,255
ImageAlpha=[mGlowMid]
DynamicVariables=1
Hidden=1

[MeterBoltGlowNear]
Meter=IMAGE
ImageName=#@#bolt.png
X=55
Y=26
W=26
H=36
ImageTint=255,255,255
ImageAlpha=[mGlowNear]
DynamicVariables=1
Hidden=1

; The bolt itself: cyan, pulsing between 55 and 255 alpha.
[MeterBolt]
Meter=IMAGE
ImageName=#@#bolt.png
X=57
Y=29
W=22
H=30
ImageTint=0,202,255
ImageAlpha=[mPulseBolt]
DynamicVariables=1
Hidden=1

;-------------------------------------------------------------
; RIGHT COLUMN — percentage + connection
;-------------------------------------------------------------

[MeterLevel]
Meter=String
MeasureName=measureLevel
FontFace=#FontFace#
FontColor=#NeonBlue#
FontSize=16
StringStyle=Bold
StringAlign=Right
X=200
Y=20
Text="%1%"
AntiAlias=1

[MeterSource]
Meter=String
MeasureName=measureSource
FontFace=#FontFace#
FontColor=#FontColor2_Neon#
FontSize=8
StringStyle=Bold
StringAlign=Right
X=200
Y=47
Text="%1"
AntiAlias=1

; Dead-feed placeholders. Same box, same alignment, dim grey so the widget
; reads as "no data" without turning into a different design.
[MeterLevelStale]
Meter=String
FontFace=#FontFace#
FontColor=140,150,165,220
FontSize=16
StringStyle=Bold
StringAlign=Right
X=200
Y=20
Text="--%"
AntiAlias=1
Hidden=1

[MeterSourceStale]
Meter=String
FontFace=#FontFace#
FontColor=140,150,165,220
FontSize=8
StringStyle=Bold
StringAlign=Right
X=200
Y=47
Text="NO SIGNAL"
AntiAlias=1
Hidden=1

; Low-battery percentage, same box as the normal one.
[MeterLevelLow]
Meter=String
MeasureName=measureLevel
FontFace=#FontFace#
FontColor=#LowBattery#
FontSize=16
StringStyle=Bold
StringAlign=Right
X=200
Y=20
Text="%1%"
AntiAlias=1
Hidden=1

; Time to full, shown only while the tray has an estimate.
[MeterEta]
Meter=String
MeasureName=measureEta
FontFace=#FontFace#
FontColor=#FontColor3#
FontSize=8
StringStyle=Bold
StringAlign=Right
X=200
Y=58
Text="%1 MIN TO FULL"
AntiAlias=1
Hidden=1

