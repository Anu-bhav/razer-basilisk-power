[Rainmeter]
Update=1000
Author=Anu-bhav
AccurateText=1
DynamicWindowSize=1

[Variables]
; Same palette/font as the custom Simplic CPU and RAM widget.
; #@# = this skin's own @Resources folder (Rainmeter does not share
; @Resources between configs), which holds the copy of Variables.inc.
@include=#@#Variables.inc
JsonUrl=file:///C:/Users/User/AppData/Local/BasiliskPower/status.json

;-------------------------------------------------------------
; MEASURES — status.json feed written by Basilisk Power
;-------------------------------------------------------------

[measureStatus]
Measure=WebParser
Url=#JsonUrl#
; NOTE: no "U" (ungreedy) flag here — it would also make \d+ ungreedy,
; so "level":57 would capture only "5" and eta 108 only "1".
RegExp=(?si)"level":\s*(-?\d+).*"charging":\s*(\d+).*"source":\s*"([^"]*)".*"eta_full_min":\s*(-?\d+)
UpdateDivider=2

; Battery % as shown in the big right column ("--" when no device reports).
[measureLevel]
Measure=WebParser
Url=[measureStatus]
StringIndex=1
Substitute="-1":"--"

; Charging flag, numeric, for the IfConditions.
[measureCharging]
Measure=WebParser
Url=[measureStatus]
StringIndex=2

; dock / wired / wireless / none → connection word.
[measureSource]
Measure=WebParser
Url=[measureStatus]
StringIndex=3
Substitute="dock":"DOCKED","wired":"WIRED","wireless":"WIRELESS","unknown":"?","none":"NO DEVICE"

; Minutes to full while charging ("" when not charging).
[measureEta]
Measure=WebParser
Url=[measureStatus]
StringIndex=4
Substitute="-1":""

; 0-100 for the fill; -1 (no data) clamps to an empty battery.
; MinValue/MaxValue are required: without them the bar scales against the
; default 0..1 range and a 57% level renders as a full battery.
[mLevelCalc]
Measure=Calc
MinValue=0
MaxValue=100
Formula=(measureLevel < 0 ? 0 : (measureLevel > 100 ? 100 : measureLevel))

; Charging → magenta fill + bolt + CHARGING word; else cyan fill.
[cCharging]
Measure=Calc
Formula=measureCharging
IfCondition=cCharging = 1
IfTrueAction=[!HideMeter MeterFillCyan][!ShowMeter MeterFillMagenta][!ShowMeter MeterBolt][!ShowMeter MeterChargingWord][!Redraw]
IfFalseAction=[!ShowMeter MeterFillCyan][!HideMeter MeterFillMagenta][!HideMeter MeterBolt][!HideMeter MeterChargingWord][!Redraw]

; ETA line only while an estimate exists.
[cEta]
Measure=Calc
Formula=measureEta
IfCondition=cEta > 0
IfTrueAction=[!ShowMeter MeterEta][!Redraw]
IfFalseAction=[!HideMeter MeterEta][!Redraw]

;-------------------------------------------------------------
; BATTERY GLYPH (transparent PNG outline over a dynamic fill)
;-------------------------------------------------------------

; Level fill inside the battery body — cyan, or magenta while charging.
[MeterFillCyan]
Meter=Bar
MeasureName=mLevelCalc
X=34
Y=24
W=68
H=40
BarColor=#FontColor1_Area#
BarOrientation=Horizontal

[MeterFillMagenta]
Meter=Bar
MeasureName=mLevelCalc
X=34
Y=24
W=68
H=40
BarColor=#FontColor2_Area#
BarOrientation=Horizontal
Hidden=1

; Battery outline drawn above the fill (transparent interior).
[MeterBattery]
Meter=IMAGE
ImageName=#@#battery.png
X=30
Y=20
W=92
H=48

; Charging bolt, centered on the battery body.
[MeterBolt]
Meter=IMAGE
ImageName=#@#bolt.png
X=57
Y=29
W=22
H=30
Hidden=1

;-------------------------------------------------------------
; RIGHT COLUMN — percentage + connection
;-------------------------------------------------------------

[MeterLevel]
Meter=String
MeasureName=measureLevel
FontFace=#FontFace#
FontColor=#FontColor1#
FontSize=16
StringStyle=Bold
StringAlign=Right
X=200
Y=20
Text="%1%"
AntiAlias=1

[MeterSource]
Meter=String
MeasureName=measureSource
FontFace=#FontFace#
FontColor=#FontColor2#
FontSize=8
StringStyle=Bold
StringAlign=Right
X=200
Y=47
Text="%1"
AntiAlias=1

;-------------------------------------------------------------
; DIVIDER + LABEL ROW (cpu_ram layout)
;-------------------------------------------------------------

[MeterLine]
Meter=IMAGE
X=0
Y=90
W=250
H=2
SolidColor=#FontColor3#

[MeterName]
Meter=String
FontFace=#FontFace#
FontColor=#FontColor3#
FontSize=11
StringStyle=Bold
X=36
Y=99
Text="BASILISK"
AntiAlias=1

[MeterChargingWord]
Meter=String
FontFace=#FontFace#
FontColor=#FontColor2#
FontSize=8
StringStyle=Bold
StringAlign=Right
X=208
Y=62
Text="CHARGING"
AntiAlias=1
Hidden=1

[MeterEta]
Meter=String
MeasureName=measureEta
FontFace=#FontFace#
FontColor=#FontColor3#
FontSize=8
StringStyle=Bold
StringAlign=Right
X=228
Y=102
Text="%1 MIN TO FULL"
AntiAlias=1
Hidden=1
